[build]
  command = "npm run build:netlify"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["server/data/*.json", "src/data/*.json"]

[[redirects]]
  from = "/passport"
  to = "/.netlify/functions/api/passport"
  status = 200
  force = true

[[redirects]]
  from = "/wheel-prizes"
  to = "/.netlify/functions/api/wheel-prizes"
  status = 200
  force = true

[[redirects]]
  from = "/prizes-won"
  to = "/.netlify/functions/api/prizes-won"
  status = 200
  force = true

[[redirects]]
  from = "/kid-a/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/kid-a/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
