[build]
  command = "npm run build:netlify"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/passport"
  to = "/.netlify/functions/api/passport"
  status = 200
  force = true

[[redirects]]
  from = "/api/wheel-prizes"
  to = "/.netlify/functions/api/wheel-prizes"
  status = 200
  force = true

[[redirects]]
  from = "/api/prizes-kid"
  to = "/.netlify/functions/api/prizes-kid"
  status = 200
  force = true

[[redirects]]
  from = "/api/kids"
  to = "/.netlify/functions/api/kids"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/api/auth/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/api/admin/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/magic-links"
  to = "/.netlify/functions/api/admin/magic-links"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/export"
  to = "/.netlify/functions/api/admin/export"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/import"
  to = "/.netlify/functions/api/admin/import"
  status = 200
  force = true

[[redirects]]
  from = "/kid-a"
  to = "/"
  status = 301

[[redirects]]
  from = "/kid-a/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
